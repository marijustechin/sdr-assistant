services:
  db:
    image: postgres:17-alpine
    container_name: sdr-assistant-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: sdr
      POSTGRES_PASSWORD: sdr
      POSTGRES_DB: sdr_assistant
    ports:
      - "5433:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sdr -d sdr_assistant"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  db-data:
